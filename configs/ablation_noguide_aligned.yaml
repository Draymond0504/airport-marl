# Matched ablation protocol. Keep identical to ablation_guided_aligned.yaml
# except for env.use_astar_guide.

env:
  num_agents: 8
  max_steps: 500
  max_speed: 3.0
  min_speed: 0.0
  speed_step: 0.21
  gate_speed_limit: 0.15
  turn_speed_limit: 1.0
  turn_brake_buffer: 0.5
  enable_anticipatory_turn_braking: true
  max_neighbors: 5
  taxiway_close_prob: 0.0
  priority_change_prob: 0.0
  delay_prob: 0.0
  layout: "F"
  disable_corridor: false
  enable_deadlock_recovery: false
  auto_speed: true
  use_astar_guide: false
  midroute_start_prob: 0.0
  random_flow_mix: false
  entry_stagger_steps: 40
  gate_shadow_mode: "extended"
  shadow_release_headway_steps: 0
  prevent_occupied_target_entry: false
  enforce_reference_progress: false
  preemptive_replan: false
  physical_clearance_shield: false
  pre_entry_clearance_guard: false

reward:
  completion: 50.0
  team_bonus: 30.0
  efficiency_rate: 0.0
  proximity: 0.8
  step_penalty: -0.02
  conflict: -100.0
  yield_bonus: 0.0
  deadlock: -0.5
  wait: -0.05
  blocking: -0.2
  path_deviation: -0.0
  team_progress: 10.0
  timeout: -15.0

training:
  total_episodes: 8000
  batch_size: 256
  buffer_size: 10000
  lr_actor: 3.0e-5
  lr_critic: 1.0e-5
  gamma: 0.99
  gae_lambda: 0.97
  clip_epsilon: 0.15
  entropy_coef: 0.05
  value_loss_coef: 0.5
  max_grad_norm: 0.5
  update_epochs: 5
  num_mini_batches: 4
  hidden_dim: 256
  num_envs: 4
  rollouts_per_update: 4
  save_interval: 400
  log_interval: 100
  enable_lr_decay: false
  eval_interval: 200
  eval_episodes: 60
  eval_seed: 1042
  holdout_eval_seed: 2042
  holdout_eval_episodes: 200
  selection_full_weight: 1.0
  selection_timeout_weight: 0.4
  selection_crash_weight: 3.0
  individual_advantage_weight: 0.35
  target_kl: 0.012
  action_diagnostic_episodes: 8
  action_diagnostic_trace_episodes: 2

test:
  num_episodes: 50
  model_path: ""
