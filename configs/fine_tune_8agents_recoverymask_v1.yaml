# Fine-tune after repairing stale-reference replanning and A*-approved
# recovery U-turns. The frozen actor already benefits from the corrected
# execution semantics; use a small actor rate to reduce remaining voluntary
# waits without overwriting that improvement.

env:
  num_agents: 8
  max_steps: 500
  max_speed: 3.0
  min_speed: 0.0
  speed_step: 0.21
  max_neighbors: 5
  taxiway_close_prob: 0.0
  priority_change_prob: 0.0
  delay_prob: 0.0
  layout: "F"
  disable_corridor: false
  auto_speed: true
  use_astar_guide: true
  midroute_start_prob: 0.0
  random_flow_mix: false
  gate_shadow_mode: "extended"
  entry_stagger_steps: 24
  departure_stagger_steps: 40
  shadow_release_headway_steps: 24
  prevent_occupied_target_entry: true
  enforce_reference_progress: true
  preemptive_replan: true
  preemptive_replan_cooldown_steps: 3
  physical_clearance_shield: true
  physical_clearance_min_distance_sq: 3.0
  pre_entry_clearance_guard: false

reward:
  completion: 100.0
  team_bonus: 80.0
  team_progress: 20.0
  conflict: -150.0
  proximity: 0.25
  step_penalty: -0.04
  wait: -0.08
  avoidable_wait: -0.25
  deadlock: -1.5
  yield_bonus: 0.15
  blocking: -0.6
  path_deviation: -0.05
  efficiency_rate: 0.0
  timeout: -50.0

training:
  total_episodes: 1200
  batch_size: 256
  buffer_size: 10000
  lr_actor: 3.0e-6
  lr_critic: 1.0e-5
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.10
  entropy_coef: 0.006
  value_loss_coef: 0.5
  max_grad_norm: 0.5
  update_epochs: 3
  num_mini_batches: 4
  hidden_dim: 256
  num_envs: 4
  rollouts_per_update: 4
  save_interval: 200
  log_interval: 100
  enable_lr_decay: false
  eval_interval: 100
  eval_episodes: 60
  eval_seed: 1042
  holdout_eval_seed: 2042
  holdout_eval_episodes: 200
  selection_full_weight: 1.5
  selection_timeout_weight: 0.6
  selection_crash_weight: 3.0
  individual_advantage_weight: 0.35
  target_kl: 0.008
  action_diagnostic_episodes: 8
  action_diagnostic_trace_episodes: 2

test:
  num_episodes: 50
  model_path: "checkpoints/stage3_clearance_pilot_v1/best_eval.pt"
