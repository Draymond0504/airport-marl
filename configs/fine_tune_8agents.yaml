# Same topology, observations, and action space as improved_stable.yaml.
# This is a conservative second-stage fine-tuning configuration for an
# existing 8-agent MAPPO checkpoint, not a replacement curriculum.

env:
  num_agents: 8
  max_steps: 500
  max_speed: 3.0
  min_speed: 0.0
  speed_step: 0.21
  max_neighbors: 5
  taxiway_close_prob: 0.0
  priority_change_prob: 0.0
  delay_prob: 0.0
  layout: "F"
  disable_corridor: false
  auto_speed: true
  use_astar_guide: true
  midroute_start_prob: 0.0
  random_flow_mix: false
  entry_stagger_steps: 40

reward:
  # Completion and team completion dominate potential-based path progress.
  completion: 100.0
  team_bonus: 80.0
  team_progress: 20.0
  conflict: -120.0
  proximity: 0.25
  step_penalty: -0.03
  wait: -0.03
  deadlock: -1.0
  yield_bonus: 0.15
  blocking: -0.4
  path_deviation: -0.05
  efficiency_rate: 0.0
  # Distance-weighted terminal cost for released aircraft that timeout.
  timeout: -30.0

training:
  total_episodes: 6000
  batch_size: 256
  buffer_size: 10000
  # Applied after optimizer state is loaded from the checkpoint.
  lr_actor: 1.0e-5
  lr_critic: 2.0e-5
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.10
  entropy_coef: 0.03
  value_loss_coef: 0.5
  max_grad_norm: 0.5
  update_epochs: 3
  num_mini_batches: 4
  hidden_dim: 256
  # Four independent episodes are collected before each PPO update.
  num_envs: 4
  rollouts_per_update: 4
  save_interval: 400
  log_interval: 100
  enable_lr_decay: false
  eval_interval: 200
  eval_episodes: 40
  # Fixed model-selection set and independent final holdout set.
  eval_seed: 1042
  holdout_eval_seed: 2042
  holdout_eval_episodes: 100
  selection_full_weight: 0.5
  selection_timeout_weight: 0.2
  selection_crash_weight: 2.0
  individual_advantage_weight: 0.35
  target_kl: 0.015

test:
  num_episodes: 50
  model_path: "checkpoints/stage3_from_4agents_v1/stage3_8agents_best_eval.pt"
