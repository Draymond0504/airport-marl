# Recovery phase after fixing irreversible leaf-node action masks.
# The Actor transfers route-selection knowledge, while Critic and optimizer
# states are intentionally reset with --actor-only.

env:
  num_agents: 8
  max_steps: 500
  max_speed: 3.0
  min_speed: 0.0
  speed_step: 0.21
  max_neighbors: 5
  taxiway_close_prob: 0.0
  priority_change_prob: 0.0
  delay_prob: 0.0
  layout: "F"
  disable_corridor: false
  auto_speed: true
  use_astar_guide: true
  midroute_start_prob: 0.0
  random_flow_mix: false
  gate_shadow_mode: "extended"
  entry_stagger_steps: 24
  departure_stagger_steps: 40
  shadow_release_headway_steps: 24

reward:
  completion: 100.0
  team_bonus: 80.0
  team_progress: 20.0
  conflict: -150.0
  proximity: 0.25
  step_penalty: -0.04
  wait: -0.08
  deadlock: -1.5
  yield_bonus: 0.15
  blocking: -0.6
  path_deviation: -0.05
  efficiency_rate: 0.0
  timeout: -50.0

training:
  total_episodes: 4000
  batch_size: 256
  buffer_size: 10000
  lr_actor: 1.0e-5
  lr_critic: 3.0e-5
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.10
  entropy_coef: 0.025
  value_loss_coef: 0.5
  max_grad_norm: 0.5
  update_epochs: 3
  num_mini_batches: 4
  hidden_dim: 256
  num_envs: 4
  rollouts_per_update: 4
  save_interval: 400
  log_interval: 100
  enable_lr_decay: false
  eval_interval: 200
  eval_episodes: 60
  eval_seed: 1042
  holdout_eval_seed: 2042
  holdout_eval_episodes: 200
  selection_full_weight: 1.0
  selection_timeout_weight: 0.4
  selection_crash_weight: 3.0
  individual_advantage_weight: 0.35
  target_kl: 0.012

test:
  num_episodes: 50
  model_path: "checkpoints/stage3_priorityfix_v1/best_eval.pt"
