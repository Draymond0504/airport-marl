# Stable no-guide ablation config. Keep this identical to improved_stable.yaml
# except for use_astar_guide so the ablation isolates the guidance signal.

env:
  num_agents: 8
  max_steps: 500
  max_speed: 3.0
  min_speed: 0.0
  speed_step: 0.21
  max_neighbors: 5
  taxiway_close_prob: 0.0
  priority_change_prob: 0.0
  delay_prob: 0.0
  layout: "F"
  disable_corridor: False
  auto_speed: True
  use_astar_guide: False
  midroute_start_prob: 0.0
  random_flow_mix: False
  entry_stagger_steps: 40

reward:
  completion: 50.0
  team_bonus: 30.0
  efficiency_rate: 0.0
  proximity: 0.8
  step_penalty: -0.02
  conflict: -100.0
  yield_bonus: 0.0
  deadlock: -0.5
  wait: -0.05
  blocking: -0.2
  path_deviation: -0.0
  team_progress: 10.0

training:
  total_episodes: 8000
  batch_size: 256
  buffer_size: 10000
  lr_actor: 3.0e-5
  lr_critic: 1.0e-5
  gamma: 0.99
  gae_lambda: 0.97
  clip_epsilon: 0.15
  entropy_coef: 0.05
  value_loss_coef: 0.5
  max_grad_norm: 0.5
  update_epochs: 5
  num_mini_batches: 4
  hidden_dim: 256
  num_envs: 8
  save_interval: 1000
  log_interval: 100
  enable_lr_decay: False
  eval_interval: 500
  eval_episodes: 20

test:
  num_episodes: 50
  model_path: "checkpoints/no_guide_stable/latest.pt"
