# airport_marl 默认配置文件

env:
  num_agents: 4
  max_steps: 200
  max_speed: 3.0
  min_speed: 0.0
  speed_step: 0.5
  max_neighbors: 5
  # 动态事件概率
  taxiway_close_prob: 0.01
  priority_change_prob: 0.01
  delay_prob: 0.02
  # 布局选择: "default"(29节点), "A"(58节点双翼), "B"(60节点环形)
  layout: "D"

reward:
  # ---- 完成信号（正向信号必须主导） ----
  completion: 100.0       # 完成基础奖励（一旦完成有巨额奖励）
  team_bonus: 200.0        # 全员无碰撞完成的额外团队奖励
  efficiency_rate: 0.2    # 效率系数：completion时 × 剩余步数，快完成额外奖励
  proximity: 0.5          # 节点跳跃靠近奖（提供稀疏指引）

  # ---- 惩罚（量级应小于正向信号） ----
  step_penalty: -0.2      # 每步固定惩罚（促使完成）
  conflict: -10.0         # 碰撞出局惩罚（极高，因为会同时失去100分completion）
  
  # ---- 辅助惩罚（仅作分项统计观察，不计入模型奖励计算） ----
  wait: -0.5              # 等待统计（权重-0.5）
  speed_deviation: -0.1   # 速度波动统计
  path_deviation: -2.0    # 路径偏离统计
  deadlock: -0.25          # 死锁卡顿统计

training:
  total_episodes: 50000
  batch_size: 256
  buffer_size: 10000
  lr_actor: 3.0e-4
  lr_critic: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.15      # 更保守的策略更新，降低震荡
  entropy_coef: 0.02      # 增强探索 (相对于0.01调高，但比0.05稳定)
  value_loss_coef: 0.5
  max_grad_norm: 0.5
  update_epochs: 5        # 减少过拟合当前batch
  num_mini_batches: 4
  hidden_dim: 128
  num_envs: 8
  save_interval: 1000
  log_interval: 100

test:
  num_episodes: 50
  model_path: "checkpoints/latest.pt"
