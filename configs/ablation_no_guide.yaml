# ablation_no_guide.yaml (无 A* 先验的消融实验组)

env:
  num_agents: 8
  max_steps: 500
  max_speed: 3.0
  min_speed: 0.0
  speed_step: 0.21
  max_neighbors: 5
  taxiway_close_prob: 0.01
  priority_change_prob: 0.01
  delay_prob: 0.02
  layout: "F"
  disable_corridor: False
  auto_speed: True
  use_astar_guide: False    # 关键点：关闭 A* 先验

reward:
  completion: 50.0
  team_bonus: 30.0
  efficiency_rate: 0.0
  proximity: 0.8
  step_penalty: -0.01
  conflict: -100.0
  yield_bonus: 0.0
  deadlock: -0.5
  wait: -0.05
  blocking: -0.2
  path_deviation: -0.0
  team_progress: 10.0

training:
  total_episodes: 5000       # 消融实验训练 5000 轮
  batch_size: 256
  buffer_size: 10000
  lr_actor: 5.0e-5
  lr_critic: 0.5e-4
  gamma: 0.99
  gae_lambda: 0.97
  clip_epsilon: 0.10
  entropy_coef: 0.02
  value_loss_coef: 0.5
  max_grad_norm: 0.5
  update_epochs: 5
  num_mini_batches: 4
  hidden_dim: 128
  num_envs: 8
  save_interval: 1000
  log_interval: 100

test:
  num_episodes: 20
  model_path: "checkpoints/best.pt"
