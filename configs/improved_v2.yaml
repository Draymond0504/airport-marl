# airport_marl 改进配置文件 - v2 (奖励调整版)

env:
  num_agents: 8
  max_steps: 500
  max_speed: 3.0
  min_speed: 0.0
  speed_step: 0.21   # 物理标定: 0.98 m/s^2 * 1.127^2 / 5.833 = 0.213 unit/step
  max_neighbors: 5
  # 动态事件概率
  taxiway_close_prob: 0.01
  priority_change_prob: 0.01
  delay_prob: 0.02
  layout: "F"
  disable_corridor: False   # 开启廊道保护锁
  auto_speed: True          # 自动调速
  use_astar_guide: True     # 开启 A* 先验引导（默认）

reward:
  # ---- 完成信号（正向信号主导） ----
  completion: 50.0          # 提升完成奖励，主导正向信号
  team_bonus: 30.0          # ↑ 大幅提升，使全队通关信号压倒个人利益
  efficiency_rate: 0.0 #0.125
  proximity: 0.8            # 提供前进激励，防止智能体龟缩
  step_penalty: -0.01 #-0.1

  # ---- 核心惩罚 ----
  conflict: -100.0            # 适度重罚（-30太重导致相互不敢动，-3太轻导致自杀止损）

  # ---- 协同奖励 ----
  yield_bonus: 0.0          # 让行成功奖励

  # ---- 次要惩罚 ----
  deadlock: -0.5 #-3.0            # 重新启用较高惩罚，迫使智能体避开高并发拥堵死锁
  wait: -0.05               # ↓ 降低，防止廊道等待期智能体因惩罚过大而放弃
  blocking: -0.2            # [新增] 阻塞别人停留在路口的惩罚
  path_deviation: -0.0 #-0.3

  # ---- 团队协同与进度 ----
  team_progress: 10.0       # [新增] 每一架飞机完成时，全队平分的稀疏进度奖励

training:
  total_episodes: 5000       # 根据 README，消融实验跑 5000 就够了，不过我设为 5000 即可
  batch_size: 256
  buffer_size: 10000
  lr_actor: 5.0e-5       # ↓ 从3e-4降至1.5e-4
  lr_critic: 0.5e-4      # ↓ 从3e-4降至0.5e-4
  gamma: 0.99
  gae_lambda: 0.97       # ↑ 从0.95提升至0.97
  clip_epsilon: 0.10     # ↓ 从0.15降至0.1
  entropy_coef: 0.02     # ↑ 从0.02提升至0.05
  value_loss_coef: 0.5
  max_grad_norm: 0.5
  update_epochs: 5
  num_mini_batches: 4
  hidden_dim: 128
  num_envs: 8
  save_interval: 1000
  log_interval: 100

test:
  num_episodes: 20
  model_path: "checkpoints/best.pt"
